name: iOS snapshots

on:
  push:
    branches: [main, "feat/**"]
    paths:
      - "ios/**"
      - "shared/scripts/fetch-fonts.sh"
      - ".github/workflows/ios-snapshots.yml"
  pull_request:
    paths:
      - "ios/**"
      - "shared/scripts/fetch-fonts.sh"
      - ".github/workflows/ios-snapshots.yml"
  workflow_dispatch:

jobs:
  snapshot:
    name: SwiftUI snapshot tests (macOS runner)
    # macos-26 = macOS Tahoe + Xcode 26 (released Q1 2026, free for public repos: 2000 min/mo)
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Xcode + Swift
        run: |
          xcodebuild -version
          swift --version
          xcrun simctl list devices iOS available | head -20

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ios/LiulianUI/.build
          key: swift-pkgs-${{ runner.os }}-${{ hashFiles('ios/LiulianUI/Package.resolved') }}
          restore-keys: |
            swift-pkgs-${{ runner.os }}-

      - name: Install fonts (required for snapshots — must match design-system contract)
        run: bash shared/scripts/fetch-fonts.sh

      - name: Build + run snapshot tests
        working-directory: ios/LiulianUI
        run: |
          set -o pipefail
          # macos-26 runner ships iPhone 17 + 16e simulators (not iPhone 15).
          # Pick latest iPhone 17 dynamically so this survives Xcode minor bumps.
          DEVICE_ID=$(xcrun simctl list devices iOS available -j | \
            python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devices in data['devices'].items():
              if 'iOS' not in runtime: continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone 17' in d.get('name',''):
                      print(d['udid']); break
              else: continue
              break")
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -scheme LiulianUI \
            -destination "platform=iOS Simulator,id=${DEVICE_ID}" \
            -enableCodeCoverage NO \
            -resultBundlePath TestResults.xcresult

      - name: Upload PNG snapshots (success — VR baseline)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshots
          path: ios/LiulianUI/Tests/LiulianUITests/__Snapshots__/

      - name: Upload failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-snapshot-failures
          path: |
            ios/LiulianUI/Tests/LiulianUITests/__Snapshots__/
            ios/LiulianUI/TestResults.xcresult
